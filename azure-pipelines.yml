trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend-two-variables

stages:

# ============================================================
# BUILD
# ============================================================

- stage: Build
  displayName: Build and Push Backend Two

  jobs:
    - job: BuildPush
      displayName: Build NestJS and Push Docker Image

      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: Use Node.js 22
          inputs:
            versionSpec: "22.x"

        - script: |
            set -e

            npm ci
            npm run build
          displayName: Validate NestJS Build

        - task: AzureCLI@2
          displayName: Build and Push Image to ACR
          inputs:
            azureSubscription: 'sc-azure-aks-microservices'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -e

              echo "Logging into ACR..."

              az acr login \
                --name $(ACR_NAME)

              echo "Building Backend Two image..."

              docker build \
                -t $(BACKEND_TWO_IMAGE_URI):$(Build.BuildId) \
                .

              echo "Pushing Backend Two image..."

              docker push \
                $(BACKEND_TWO_IMAGE_URI):$(Build.BuildId)

# ============================================================
# DEPLOY
# ============================================================

- stage: Deploy
  displayName: Deploy Backend Two to AKS

  dependsOn: Build

  jobs:
    - job: DeployBackendTwo
      displayName: Helm Deploy Backend Two

      steps:
        - checkout: self

        - task: HelmInstaller@1
          displayName: Install Helm
          inputs:
            helmVersionToInstall: latest

        - task: AzureCLI@2
          displayName: Deploy Backend Two
          inputs:
            azureSubscription: 'sc-azure-aks-microservices'
            scriptType: bash
            scriptLocation: inlineScript

            inlineScript: |
              set -e

              echo "Connecting to AKS..."

              az aks get-credentials \
                --resource-group $(AKS_RESOURCE_GROUP) \
                --name $(AKS_CLUSTER_NAME) \
                --overwrite-existing

              echo "Creating namespace if required..."

              kubectl create namespace $(K8S_NAMESPACE) \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              # ------------------------------------------------
              # Create production environment file
              # ------------------------------------------------

              ENV_FILE="$(Agent.TempDirectory)/backend-two.env.prod"

              cat > "$ENV_FILE" <<EOF
              APP_PORT=$(BACKEND_TWO_PORT)
              SERVICE_MESSAGE=$(BACKEND_TWO_MESSAGE)
              ENVIRONMENT=$(ENVIRONMENT)
              EOF

              echo "Creating/updating Kubernetes Secret..."

              kubectl create secret generic backend-two-env \
                --namespace $(K8S_NAMESPACE) \
                --from-file=.env.prod="$ENV_FILE" \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              # ------------------------------------------------
              # Generate CI Helm override values
              # ------------------------------------------------

              VALUES_FILE="$(Agent.TempDirectory)/backend-two-values.yaml"

              cat > "$VALUES_FILE" <<EOF
              replicaCount: $(BACKEND_TWO_REPLICA_COUNT)

              image:
                repository: "$(BACKEND_TWO_IMAGE_URI)"
                tag: "$(Build.BuildId)"
                pullPolicy: Always

              service:
                targetPort: $(BACKEND_TWO_PORT)

              resources:
                requests:
                  cpu: "$(BACKEND_TWO_CPU)"
                  memory: "$(BACKEND_TWO_MEMORY)"
                limits:
                  cpu: "$(BACKEND_TWO_CPU)"
                  memory: "$(BACKEND_TWO_MEMORY)"

              autoscaling:
                enabled: $(BACKEND_TWO_AUTOSCALING_ENABLED)
                minReplicas: $(BACKEND_TWO_MIN_REPLICAS)
                maxReplicas: $(BACKEND_TWO_MAX_REPLICAS)
                targetCPUUtilizationPercentage: 80

              configVersion: "$(Build.BuildId)"

              app:
                environment: "$(ENVIRONMENT)"
                namespace: "$(K8S_NAMESPACE)"
              EOF

              echo "Validating Helm chart..."

              helm lint \
                helm/backend-two \
                -f "$VALUES_FILE"

              echo "Deploying Backend Two..."

              helm upgrade --install backend-two \
                helm/backend-two \
                --namespace $(K8S_NAMESPACE) \
                -f "$VALUES_FILE" \
                --wait \
                --timeout 5m

              echo "Backend Two deployment status:"

              kubectl get pods \
                -n $(K8S_NAMESPACE)

              kubectl get service backend-two-service \
                -n $(K8S_NAMESPACE)

              kubectl get hpa \
                -n $(K8S_NAMESPACE)