trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend-one-variables

stages:

# ============================================================
# BUILD
# ============================================================

- stage: Build
  displayName: Build and Push Backend One

  jobs:
    - job: BuildPush
      displayName: Build NestJS and Push Docker Image

      steps:
        - checkout: self

        - task: NodeTool@0
          displayName: Use Node.js 22
          inputs:
            versionSpec: "22.x"

        - script: |
            set -e

            npm ci
            npm run build
          displayName: Validate NestJS Build

        - task: AzureCLI@2
          displayName: Build and Push Image to ACR
          inputs:
            azureSubscription: 'sc-azure-aks-microservices'
            scriptType: bash
            scriptLocation: inlineScript

            inlineScript: |
              set -e

              az acr login \
                --name $(ACR_NAME)

              docker build \
                -t $(BACKEND_ONE_IMAGE_URI):$(Build.BuildId) \
                .

              docker push \
                $(BACKEND_ONE_IMAGE_URI):$(Build.BuildId)

# ============================================================
# DEPLOY
# ============================================================

- stage: Deploy
  displayName: Deploy Backend One to AKS

  dependsOn: Build

  jobs:
    - job: DeployBackendOne
      displayName: Helm Deploy Backend One

      steps:
        - checkout: self

        - task: HelmInstaller@1
          displayName: Install Helm
          inputs:
            helmVersionToInstall: latest

        - task: AzureCLI@2
          displayName: Deploy Backend One
          inputs:
            azureSubscription: 'sc-azure-aks-microservices'
            scriptType: bash
            scriptLocation: inlineScript

            inlineScript: |
              set -e

              echo "Connecting to AKS..."

              az aks get-credentials \
                --resource-group $(AKS_RESOURCE_GROUP) \
                --name $(AKS_CLUSTER_NAME) \
                --overwrite-existing

              kubectl create namespace $(K8S_NAMESPACE) \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              # ------------------------------------------------
              # Production environment
              # ------------------------------------------------

              ENV_FILE="$(Agent.TempDirectory)/backend-one.env.prod"

              cat > "$ENV_FILE" <<EOF
              APP_PORT=$(BACKEND_ONE_PORT)
              SERVICE_MESSAGE=$(BACKEND_ONE_MESSAGE)
              ENVIRONMENT=$(ENVIRONMENT)
              EOF

              kubectl create secret generic backend-one-env \
                --namespace $(K8S_NAMESPACE) \
                --from-file=.env.prod="$ENV_FILE" \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              # ------------------------------------------------
              # Helm values
              # ------------------------------------------------

              VALUES_FILE="$(Agent.TempDirectory)/backend-one-values.yaml"

              cat > "$VALUES_FILE" <<EOF
              replicaCount: $(BACKEND_ONE_REPLICA_COUNT)

              image:
                repository: "$(BACKEND_ONE_IMAGE_URI)"
                tag: "$(Build.BuildId)"
                pullPolicy: Always

              service:
                targetPort: $(BACKEND_ONE_PORT)

              resources:
                requests:
                  cpu: "$(BACKEND_ONE_CPU)"
                  memory: "$(BACKEND_ONE_MEMORY)"
                limits:
                  cpu: "$(BACKEND_ONE_CPU)"
                  memory: "$(BACKEND_ONE_MEMORY)"

              autoscaling:
                enabled: $(BACKEND_ONE_AUTOSCALING_ENABLED)
                minReplicas: $(BACKEND_ONE_MIN_REPLICAS)
                maxReplicas: $(BACKEND_ONE_MAX_REPLICAS)
                targetCPUUtilizationPercentage: 80

              configVersion: "$(Build.BuildId)"

              app:
                environment: "$(ENVIRONMENT)"
                namespace: "$(K8S_NAMESPACE)"
              EOF

              echo "Validating Helm chart..."

              helm lint \
                helm/backend-one \
                -f "$VALUES_FILE"

              echo "Deploying Backend One..."

              helm upgrade --install backend-one \
                helm/backend-one \
                --namespace $(K8S_NAMESPACE) \
                -f "$VALUES_FILE" \
                --wait \
                --timeout 5m

              echo "Deployment status:"

              kubectl get pods \
                -n $(K8S_NAMESPACE)

              kubectl get services \
                -n $(K8S_NAMESPACE)

              kubectl get ingress \
                -n $(K8S_NAMESPACE)

              kubectl get hpa \
                -n $(K8S_NAMESPACE)