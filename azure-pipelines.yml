trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: backend-two-variables

stages:

# ============================================================
# STAGE 1 - BUILD AND PUSH IMAGE
# ============================================================

- stage: Build
  displayName: Build and Push Backend Two

  jobs:

    - job: BuildPush
      displayName: Build NestJS and Push Docker Image

      steps:

        - checkout: self

        # ------------------------------------------------------
        # Node.js
        # ------------------------------------------------------

        - task: NodeTool@0
          displayName: Use Node.js 22
          inputs:
            versionSpec: "22.x"

        # ------------------------------------------------------
        # Validate NestJS application
        # ------------------------------------------------------

        - script: |
            set -e

            echo "Installing dependencies..."
            npm ci

            echo "Building NestJS application..."
            npm run build

          displayName: Install Dependencies and Build

        # ------------------------------------------------------
        # Build Docker image and push to ACR
        # ------------------------------------------------------

        - task: AzureCLI@2
          displayName: Build and Push Docker Image to ACR

          inputs:

            azureSubscription: 'sc-azure-aks-microservices'

            scriptType: bash

            scriptLocation: inlineScript

            inlineScript: |

              set -e

              echo "Logging into Azure Container Registry..."

              az acr login \
                --name $(ACR_NAME)


              echo "Building Backend Two Docker image..."

              docker build \
                -t $(BACKEND_TWO_IMAGE_URI):$(Build.BuildId) \
                .


              echo "Pushing Backend Two Docker image..."

              docker push \
                $(BACKEND_TWO_IMAGE_URI):$(Build.BuildId)


              echo "Docker image pushed successfully."

              echo "Image:"
              echo "$(BACKEND_TWO_IMAGE_URI):$(Build.BuildId)"


# ============================================================
# STAGE 2 - DEPLOY TO AKS
# ============================================================

- stage: Deploy
  displayName: Deploy Backend Two to AKS

  dependsOn: Build

  condition: succeeded()

  jobs:

    - job: DeployBackendTwo
      displayName: Helm Deploy Backend Two

      steps:

        - checkout: self


        # ------------------------------------------------------
        # Install Helm
        # ------------------------------------------------------

        - task: HelmInstaller@1
          displayName: Install Helm

          inputs:
            helmVersionToInstall: latest


        # ------------------------------------------------------
        # Connect to AKS and Deploy
        # ------------------------------------------------------

        - task: AzureCLI@2
          displayName: Deploy Backend Two

          inputs:

            azureSubscription: 'sc-azure-aks-microservices'

            scriptType: bash

            scriptLocation: inlineScript

            inlineScript: |

              set -e


              # ==================================================
              # Install kubectl + kubelogin
              # ==================================================

              echo "Installing kubectl and kubelogin..."

              sudo az aks install-cli


              echo "kubectl version:"
              kubectl version --client


              echo "kubelogin version:"
              kubelogin --version


              # ==================================================
              # Get AKS credentials
              # ==================================================

              echo "Connecting to AKS..."

              az aks get-credentials \
                --resource-group $(AKS_RESOURCE_GROUP) \
                --name $(AKS_CLUSTER_NAME) \
                --overwrite-existing


              # ==================================================
              # Convert kubeconfig for Entra authentication
              # ==================================================

              echo "Configuring kubelogin..."

              kubelogin convert-kubeconfig \
                -l azurecli


              # ==================================================
              # Test connection
              # ==================================================

              echo "Testing AKS connection..."

              kubectl get nodes


              # ==================================================
              # Create namespace
              # ==================================================

              echo "Creating namespace if required..."

              kubectl create namespace $(K8S_NAMESPACE) \
                --dry-run=client \
                -o yaml \
                | kubectl apply -f -


              # ==================================================
              # Create production .env.prod
              # ==================================================

              echo "Creating Backend Two environment file..."

              ENV_FILE="$(Agent.TempDirectory)/backend-two.env.prod"

              printf "APP_PORT=%s\nSERVICE_MESSAGE=%s\nENVIRONMENT=%s\n" \
                "$BACKEND_TWO_PORT" \
                "$BACKEND_TWO_MESSAGE" \
                "$ENVIRONMENT" \
                > "$ENV_FILE"


              # ==================================================
              # Create / Update Kubernetes Secret
              # ==================================================

              echo "Creating Backend Two Kubernetes secret..."

              kubectl create secret generic backend-two-env \
                --namespace $(K8S_NAMESPACE) \
                --from-file=.env.prod="$ENV_FILE" \
                --dry-run=client \
                -o yaml \
                | kubectl apply -f -


              # ==================================================
              # Validate Helm Chart
              # ==================================================

              echo "Validating Backend Two Helm chart..."

              helm lint helm/backend-two \
                --set replicaCount=$(BACKEND_TWO_REPLICA_COUNT) \
                --set-string image.repository="$(BACKEND_TWO_IMAGE_URI)" \
                --set-string image.tag="$(Build.BuildId)" \
                --set service.targetPort=$(BACKEND_TWO_PORT) \
                --set-string resources.requests.cpu="$(BACKEND_TWO_CPU)" \
                --set-string resources.requests.memory="$(BACKEND_TWO_MEMORY)" \
                --set-string resources.limits.cpu="$(BACKEND_TWO_CPU)" \
                --set-string resources.limits.memory="$(BACKEND_TWO_MEMORY)" \
                --set autoscaling.enabled=$(BACKEND_TWO_AUTOSCALING_ENABLED) \
                --set autoscaling.minReplicas=$(BACKEND_TWO_MIN_REPLICAS) \
                --set autoscaling.maxReplicas=$(BACKEND_TWO_MAX_REPLICAS) \
                --set-string configVersion="$(Build.BuildId)" \
                --set-string app.environment="$(ENVIRONMENT)" \
                --set-string app.namespace="$(K8S_NAMESPACE)"


              # ==================================================
              # Deploy Backend Two
              # ==================================================

              echo "Deploying Backend Two..."

              helm upgrade --install backend-two \
                helm/backend-two \
                --namespace $(K8S_NAMESPACE) \
                --set replicaCount=$(BACKEND_TWO_REPLICA_COUNT) \
                --set-string image.repository="$(BACKEND_TWO_IMAGE_URI)" \
                --set-string image.tag="$(Build.BuildId)" \
                --set service.targetPort=$(BACKEND_TWO_PORT) \
                --set-string resources.requests.cpu="$(BACKEND_TWO_CPU)" \
                --set-string resources.requests.memory="$(BACKEND_TWO_MEMORY)" \
                --set-string resources.limits.cpu="$(BACKEND_TWO_CPU)" \
                --set-string resources.limits.memory="$(BACKEND_TWO_MEMORY)" \
                --set autoscaling.enabled=$(BACKEND_TWO_AUTOSCALING_ENABLED) \
                --set autoscaling.minReplicas=$(BACKEND_TWO_MIN_REPLICAS) \
                --set autoscaling.maxReplicas=$(BACKEND_TWO_MAX_REPLICAS) \
                --set-string configVersion="$(Build.BuildId)" \
                --set-string app.environment="$(ENVIRONMENT)" \
                --set-string app.namespace="$(K8S_NAMESPACE)" \
                --wait \
                --timeout 5m


              # ==================================================
              # Verify Deployment
              # ==================================================

              echo ""
              echo "============================================"
              echo "Backend Two Deployment Completed"
              echo "============================================"


              echo ""
              echo "Pods:"
              kubectl get pods \
                -n $(K8S_NAMESPACE) \
                -o wide


              echo ""
              echo "Deployment:"
              kubectl get deployment backend-two \
                -n $(K8S_NAMESPACE)


              echo ""
              echo "Service:"
              kubectl get service backend-two-service \
                -n $(K8S_NAMESPACE)


              echo ""
              echo "HPA:"
              kubectl get hpa \
                -n $(K8S_NAMESPACE)

          env:

            BACKEND_TWO_PORT: $(BACKEND_TWO_PORT)

            BACKEND_TWO_MESSAGE: $(BACKEND_TWO_MESSAGE)

            ENVIRONMENT: $(ENVIRONMENT)